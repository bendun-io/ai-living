<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Living Debug</title>
    <link rel="stylesheet" href="debug.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Debug Inspector</h1>
      <p>Skills read and tools used per assistant response</p>
    </header>

    <main class="container">
      <aside class="threads">
        <h2>Threads</h2>
        <ul id="threadList"></ul>
      </aside>

      <section class="details">
        <h2 id="detailsTitle">No thread selected</h2>
        <div id="entries" class="entries"></div>
      </section>
    </main>

    <script src="debug-renderer.js"></script>
  </body>
</html>
