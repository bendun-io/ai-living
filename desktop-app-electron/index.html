<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Living</title>
    <link rel="icon" href="img/jarvis.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="app-shell">
        <aside class="sidebar">
          <button id="newChatButton" class="primary-button new-chat-button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>New chat</span>
          </button>
          <ul id="threadList" class="thread-list"></ul>
        </aside>

        <main class="main-panel">
          <div id="messages" class="messages" aria-live="polite"></div>

          <div class="composer">
            <input id="messageInput" type="text" placeholder="Type a message..." />
            <button id="sendButton" class="primary-button icon-button" aria-label="Send message" title="Send message">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
            <button id="recordButton" class="secondary-button icon-button" aria-label="Start recording" title="Start recording"></button>
          </div>
          <p id="recordingStatus" class="recording-status" aria-live="polite"></p>
        </main>
      </div>

      <footer class="status-footer" aria-live="polite">
        <span id="serviceStatusDot" class="status-dot status-error" aria-hidden="true"></span>
        <span id="serviceStatusText">Checking service connections...</span>
        <button id="debugButton" class="debug-footer-button" aria-label="Open debug window" title="Open debug window">⚙</button>
      </footer>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
