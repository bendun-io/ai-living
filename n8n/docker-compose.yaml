services:
  n8n:
    image: n8nio/n8n:1.121.0
    container_name: n8n-main
    environment:
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=xKkErhc5iFSLqad7uNKS
      - N8N_NATIVE_PYTHON_RUNNER=true
      - N8N_RUNNERS_EXTERNAL_ALLOW=numpy,pandas,requests,bs4
      - N8N_SECURE_COOKIE=false
    ports:
      - "5678:5678"
    networks:
      - ai-living-stack
    volumes:
      - n8n_data:/home/node/.n8n
    # etc.

  task-runners:
    build:
      context: ./runner
      dockerfile: Dockerfile
    container_name: n8n-runners
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-main:5679
      - N8N_RUNNERS_AUTH_TOKEN=xKkErhc5iFSLqad7uNKS
      - N8N_RUNNERS_EXTERNAL_ALLOW=numpy,pandas,requests,bs4
      # etc.
    networks:
      - ai-living-stack
    depends_on:
      - n8n

volumes:
  n8n_data:

networks:
  ai-living-stack:
    external: true
    name: ai-living-stack
