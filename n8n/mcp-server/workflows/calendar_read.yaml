# workflows/create_customer.yaml

name: calendar_read
description: Read events from the calendar.

n8n:
  url: https://n8n.bendun.io/webhook/5b6e2d7b-bfe5-484d-9a47-7e105a1b4207
  auth:
    type: header
    key: X-Auth-Token
    env: N8N_AUTH_TOKEN

input:
  type: object
  properties:
    starttime:
      type: string
      description: Start time of the calendar event in the format 2026-08-22T01:00:00+02:00.
    endtime:
      type: string
      description: End time of the calendar event in the format 2026-08-22T01:00:00+02:00.
  required:
    - starttime
    - endtime

execution:
  timeout_seconds: 30