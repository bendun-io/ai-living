services:
  beszel-hub:
    image: henrygd/beszel:latest
    container_name: beszel-hub
    restart: unless-stopped
    ports:
      - "${BESZEL_HUB_PORT:-8090}:8090"
    environment:
      TZ: Europe/Berlin
    volumes:
      - beszel-data:/data
    networks:
      - monitoring

networks:
  monitoring:
    name: monitoring

volumes:
  beszel-data:
