version: "3.9"

services:
  beszel-hub:
    image: ghcr.io/henrygd/beszel:latest
    container_name: beszel-hub
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      TZ: Europe/Berlin
    volumes:
      - beszel-data:/data
    networks:
      - monitoring

networks:
  monitoring:
    name: monitoring

volumes:
  beszel-data:
