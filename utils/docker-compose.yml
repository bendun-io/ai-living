services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_living_utils_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-living-stack

  utils-lists:
    build:
      context: ./lists-service
      dockerfile: Dockerfile
    container_name: ai_living_utils_lists
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LISTS_SERVICE_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-living-stack

  utils-rewe:
    build:
      context: ./rewe-service
      dockerfile: Dockerfile
    container_name: ai_living_utils_rewe
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REWE_SERVICE_PORT: 8020
      CDP_PORT: 9222
      CDP_HOST: 0.0.0.0
    ports:
      - "${REWE_SERVICE_PORT:-8020}:8020"
      - "${REWE_CDP_PORT:-9222}:9222"
    volumes:
      - rewe_profile_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8020/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-living-stack

volumes:
  postgres_data:
  rewe_profile_data:

networks:
  ai-living-stack:
    external: true
    name: ai-living-stack
